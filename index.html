<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Einreise Guidebook</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="ui-backdrop">
        <div class="guidebook-card">
            <header class="guidebook-header">
                <div class="guidebook-title">
                    <img src="background.png" alt="Hessen Roleplay" class="guidebook-logo">
                    <div>
                        <h1>Guidebook</h1>
                        <p>Spieler in deiner Nähe</p>
                    </div>
                </div>
                <div class="command-info">
                    <span class="command-tag" data-command="enter"></span>
                    <span class="command-tag" data-command="exit"></span>
                </div>
            </header>
            <main class="guidebook-content">
                <section class="player-list" aria-label="Spieler in Reichweite">
                    <ul id="playerList"></ul>
                </section>
                <section class="player-actions" aria-label="Aktionen">
                    <h2>Spieler Aktionen</h2>
                    <button class="action-button" data-action="einreisen">Einreisen</button>
                    <button class="action-button" data-action="secondChance">2 Chance</button>
                    <button class="action-button" data-action="ausreisen">Ausreisen</button>
                    <button class="action-button" data-action="perma">Perma</button>
                </section>
            </main>
            <footer class="guidebook-footer">
                <div class="teleport-info" data-location="entry"></div>
                <div class="teleport-info" data-location="commandEnter"></div>
                <div class="teleport-info" data-location="commandExit"></div>
            </footer>
            <section class="action-log" aria-live="polite">
                <h3>Aktionen</h3>
                <ul id="actionLog"></ul>
            </section>
        </div>
    </div>
    <script type="module" src="script.js"></script>
</body>
</html>
